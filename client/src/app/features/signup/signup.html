<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Enter your details to join the network</p>
        </div>

        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" formControlName="name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <select formControlName="state">
                        <option value="" disabled>Select State</option>
                        @for (state of states; track state) {
                        <option [value]="state">{{state}}</option>
                        }
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" formControlName="email" placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" formControlName="password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-auth" [disabled]="isLoading()">
                {{ isLoading() ? 'Processing...' : 'Register' }}
            </button>
        </form>

        <p class="auth-nav">
            Already have an account? <a routerLink="/login">Sign In</a>
        </p>
    </div>
</div>
